# pytest configuration for TCT_app.
#
# `timeout` / `timeout_method` (requires pytest-timeout, see requirements.txt):
# on 2026-07-08 a single hung test wedged the *entire* suite silently for
# ~11 minutes at 0% CPU with no self-abort — nothing printed, nothing failed,
# just a dead run someone had to notice and kill by hand. `timeout_method =
# thread` is deliberate: Windows has no SIGALRM (the default `signal` method
# is POSIX-only), and the thread watchdog dumps the stuck thread's stack and
# then aborts the WHOLE run (os._exit) rather than hanging forever — a hang
# becomes a loud, visible abort instead of a silent wedge. (It does not fail
# just the one test and continue; that trade-off is deliberate.)
[pytest]
timeout = 60
timeout_method = thread
# faulthandler dumps every thread's traceback WITHOUT needing the GIL, so it
# still fires when a native ABBA deadlock (GIL vs. Qt connection-pool mutex)
# has frozen the whole process at 0 CPU — the exact failure mode that on
# 2026-07-11 wedged the run *and* disabled the pytest-timeout watchdog thread
# (which needs the GIL to abort).  90 s > the 60 s per-test timeout so a
# normal slow test is still handled by pytest-timeout first; this only trips
# on a true hard hang, turning a silent multi-hour wedge into a stack dump.
faulthandler_timeout = 90

markers =
    timing_sensitive: wall-clock-budget assertions that can flake under CPU load/contention.
    slow: tests that are expected to take noticeably longer than the suite average.
    monkey: seeded UI monkey random-walk tests (safe-action allowlist; tests/test_ui_monkey.py).
    material_contract: the glass material contract bucket (SYNTHESIS §7.1 rungs 0-3) -- the pure GlassTier/decide_tier/transition contract, the backdrop DWM-call seams, and the token schema. Offscreen, no compositor, must stay < 20 s: it is the per-beat gate for any diff touching gui/glass_env.py, gui/backdrop.py, the style canvas path, or main.py's surface format.
