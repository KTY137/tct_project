name: edge_tct_template
description: "Edge-TCT CCE(V) map — bias -> x -> y snake (default template)"
root:
- type: loop
  axis: bias_V
  start: 0.0
  stop: -300.0
  step: -50.0
  settle_s: 0.0
  n_averages: null
  snake: false
  reduce: null
  children:
  - type: loop
    axis: stage_x
    start: -1.0
    stop: 1.0
    step: 0.1
    settle_s: 0.0
    n_averages: null
    snake: false
    reduce: null
    children:
    - type: loop
      axis: stage_y
      start: -1.0
      stop: 1.0
      step: 0.1
      settle_s: 0.05
      n_averages: null
      snake: true
      reduce: null
      children:
      - type: action
        action: acquire_waveform
        params:
          n_averages: 64
      - type: action
        action: save_point
        params: {}
safety:
  require_hv_confirmation: true
